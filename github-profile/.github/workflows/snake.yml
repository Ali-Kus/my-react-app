# ════════════════════════════════════════════════════════════════
#  Génère l'animation "snake" qui mange ton graphe de contributions.
#  C'est du VRAI contenu dynamique : une GitHub Action tourne sur un
#  cron, fabrique des SVG et les pousse sur la branche `output`.
#  Tu références ensuite ces SVG dans ton README.
# ════════════════════════════════════════════════════════════════
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit UTC
  workflow_dispatch:       # + bouton "Run workflow" manuel
  push:
    branches:
      - master

permissions:
  contents: write          # nécessaire pour pousser sur la branche output

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
