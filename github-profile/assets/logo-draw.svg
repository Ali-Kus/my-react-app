<svg
  width="800"
  height="800"
  viewBox="0 0 800 800"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Ali Kus animated logo"
>
  <!--
    "Group 43" logo, self-drawing (CSS animation lives inside the .svg,
    which is the only place GitHub keeps it). pathLength="100" normalises
    every stroke so dashoffset 100->0 draws it; inline animation-delay
    gives the cascade.
  -->
  <style>
    @keyframes draw {
      0%   { stroke-dashoffset: 100; }
      55%  { stroke-dashoffset: 0;   }
      80%  { stroke-dashoffset: 0;   }
      100% { stroke-dashoffset: 100; }
    }
    .draw-path {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 5s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .draw-path { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <rect width="800" height="800" fill="#282828"/>

  <path class="draw-path" pathLength="100" style="animation-delay:0s"    d="M750 50H550V125H650H750V250H550" stroke="#FFD900" stroke-width="20" stroke-linecap="square"/>
  <path class="draw-path" pathLength="100" style="animation-delay:0.25s" d="M350 319.998V454.998H500V319.998M475 319.998V429.998" stroke="#FFD900" stroke-width="10" stroke-linecap="square"/>
  <path class="draw-path" pathLength="100" style="animation-delay:0.5s"  d="M50 650H150M150 650L250 550M150 650L250 750M50 550V750" stroke="#FFD900" stroke-width="20" stroke-linecap="square"/>
  <path class="draw-path" pathLength="100" style="animation-delay:0.75s" d="M650 550H700M750 550H700M650 750H700M750 750H700M700 550V750" stroke="#5500FF" stroke-width="20" stroke-linecap="square"/>
  <path class="draw-path" pathLength="100" style="animation-delay:1s"    d="M325 319.998V479.998H500M300 319.998V479.998" stroke="#5500FF" stroke-width="10" stroke-linecap="square"/>

  <path d="M250 50H50V150H250V50Z" fill="#282828"/>

  <path class="draw-path" pathLength="100" style="animation-delay:1.25s" d="M50 250V150M250 250V150M50 150V50H250V150M50 150H250" stroke="#5500FF" stroke-width="20"/>
</svg>
